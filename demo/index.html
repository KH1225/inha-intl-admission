<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>외국인 특별전형 현황판 시연 영상</title>
<style>
  :root{--ink:#0b2a5b;--mute:#475569;--bg:#f4f6fb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}
  main{max-width:1100px;margin:0 auto;padding:28px 16px 40px}
  h1{font-size:clamp(22px,4vw,32px);margin:0 0 6px}
  p{margin:0 0 18px;color:var(--mute);font-size:15px}
  video{width:100%;border-radius:14px;background:#000;box-shadow:0 10px 30px rgba(11,42,91,.18);display:block}
  .note{margin-top:12px;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>외국인 특별전형 현황판 시연 영상</h1>
  <p>인하공업전문대학 국제교류팀 김경하 · 2026 AX 교육·행정혁신 우수사례</p>
  <video src="demo.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
  <div class="note">※ 영상 속 지원자 정보와 사진은 모두 시연용 가짜 데이터입니다.</div>
</main>
</body>
</html>
